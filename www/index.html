<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Mis Inversiones</title>
<style>
:root{
  --bg:#f4f6f5;--card:#ffffff;--ink:#14231e;--mute:#5d6f68;--line:#dfe6e3;
  --brand:#0f766e;--brand-ink:#ffffff;--gain:#0a7d3c;--loss:#c2261f;--warn:#9a6700;
  --gain-bg:#e3f5ea;--loss-bg:#fde8e6;--chip:#eaf0ee;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1512;--card:#13211d;--ink:#e8f1ee;--mute:#93a9a1;--line:#243a34;
  --brand:#2dd4bf;--brand-ink:#04211c;--gain:#4ade80;--loss:#ff7b72;--warn:#e3b341;
  --gain-bg:#12301f;--loss-bg:#3a1a18;--chip:#1b2e29;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0b1512;--card:#13211d;--ink:#e8f1ee;--mute:#93a9a1;--line:#243a34;
  --brand:#2dd4bf;--brand-ink:#04211c;--gain:#4ade80;--loss:#ff7b72;--warn:#e3b341;
  --gain-bg:#12301f;--loss-bg:#3a1a18;--chip:#1b2e29;--shadow:none;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;color:var(--mute);padding:6px 12px;border-radius:8px;font:inherit;font-weight:600;min-height:32px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
main{padding:12px 16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 10px;font-weight:700}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .sub{color:var(--mute);margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--chip);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--mute)}
.kpi .v{font-size:17px;font-weight:700;margin-top:2px;word-break:break-word}
.kpi .s{font-size:12px;color:var(--mute)}
.gain{color:var(--gain)}.loss{color:var(--loss)}.mute{color:var(--mute)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.gain{background:var(--gain-bg)}.badge.loss{background:var(--loss-bg)}.badge.mute{background:var(--chip)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list .item{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.list .item:first-child{border-top:0}
.item .t{font-weight:600}.item .m{font-size:13px;color:var(--mute)}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.rate b{display:block;font-size:12px;color:var(--mute)}.rate span{font-size:18px;font-weight:800}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--mute);padding:9px 2px 8px;font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--brand)}
.btn{border:0;background:var(--brand);color:var(--brand-ink);padding:11px 16px;border-radius:12px;font:inherit;font-weight:700;min-height:44px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--loss-bg);color:var(--loss)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;border-radius:28px;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total{margin-top:12px;padding:10px 12px;background:var(--chip);border-radius:10px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:10px 16px;border-radius:99px;z-index:40;font-size:14px;max-width:90vw}
.banner{background:var(--loss-bg);color:var(--loss);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.banner.info{background:var(--chip);color:var(--ink);font-weight:500}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;font:inherit;font-size:13px;white-space:nowrap;min-height:34px}
.chips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:6px 4px;border-top:1px solid var(--line);text-align:right}
table.t td:first-child,table.t th:first-child{text-align:left}
svg.spark{width:100%;height:46px;display:block}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Mis Inversiones</h1>
  <div class="seg" id="viewSeg" role="group" aria-label="Moneda de visualización">
    <button data-view="CUP">CUP</button><button data-view="USD">USD</button>
  </div>
</header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Agregar">+</button>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";
/* ============ Estado y almacenamiento ============ */
const KEY = 'inversiones_cuba_v1';
const CURS = ['CUP','USD','EUR','MLC'];
const METHODS = {efectivo:'Efectivo', transferencia:'Transferencia'};
const TYPES = {compra:'Compra', venta:'Venta', gasto:'Gasto', ingreso:'Ingreso extra'};
const OUT = {compra:1, gasto:1};            // salen de tu bolsillo
const fresh = () => ({v:1, rates:{USD:0,EUR:0,MLC:0}, ratesAt:null, ratesSrc:'', rateHist:[],
  products:[], moves:[], set:{token:'', view:'CUP', auto:true}});
let S = load();
function load(){ try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && r.v===1){ r.set = Object.assign(fresh().set, r.set); return r; } }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('No se pudo guardar (almacenamiento lleno o bloqueado)'); } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

/* ============ Formato ============ */
const nf = new Intl.NumberFormat('es', {maximumFractionDigits:2, minimumFractionDigits:0, useGrouping:'always'});
const nf2 = new Intl.NumberFormat('es', {maximumFractionDigits:2, minimumFractionDigits:2, useGrouping:'always'});
const money = (v,c,dec2) => (Number.isFinite(v) ? (dec2?nf2:nf).format(v) : '—') + ' ' + c;
const signed = (v,c) => (v>0.005?'+':'') + money(Math.abs(v)<0.005?0:v, c);
const cls = v => v>0.005 ? 'gain' : v<-0.005 ? 'loss' : 'mute';
const arrow = v => v>0.005 ? '▲' : v<-0.005 ? '▼' : '■';
const pct = v => Number.isFinite(v) ? (v>0?'+':'') + nf.format(v) + '%' : '—';
const fdate = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return dd+'/'+m+'/'+y.slice(2); };
const ftime = t => t ? new Date(t).toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : 'nunca';

/* ============ Conversión y cálculos ============ */
// r = tabla de tasas (CUP por 1 unidad de moneda). Se guarda una copia en cada movimiento.
const toCUP = (a,cur,r) => cur==='CUP' ? a : a*(r[cur]||0);
const toUSD = (a,cur,r) => cur==='USD' ? a : (r.USD ? toCUP(a,cur,r)/r.USD : 0);
const vcur = () => S.set.view;
const pick = (o) => vcur()==='USD' ? o.u : o.c;       // o = {c, u}
const other = (o) => vcur()==='USD' ? o.c : o.u;
const otherCur = () => vcur()==='USD' ? 'CUP' : 'USD';
const z = () => ({c:0,u:0});
const byDate = (a,b) => (a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);

/* Costo promedio ponderado. Ganancia realizada = venta - costo promedio de lo vendido.
   Ganancia no realizada = valor de mercado actual de lo que queda - su costo.
   Cada movimiento usa la tasa que se guardó ese día, así se ve el efecto del cambio de moneda. */
function calc(p){
  const ms = S.moves.filter(m=>m.pid===p.id).sort(byDate);
  const o = {qty:0, cost:z(), bought:z(), sold:z(), real:z(), exp:z(), inc:z(), warn:false, n:ms.length};
  for(const m of ms){
    const c = toCUP(m.amt,m.cur,m.r), u = toUSD(m.amt,m.cur,m.r);
    if(m.type==='compra'){ o.qty+=m.qty; o.cost.c+=c; o.cost.u+=u; o.bought.c+=c; o.bought.u+=u; }
    else if(m.type==='venta'){
      if(m.qty>o.qty+1e-9) o.warn=true;
      const take = Math.min(m.qty,o.qty), f = o.qty>0 ? take/o.qty : 0;
      const cc=o.cost.c*f, cu=o.cost.u*f;
      o.real.c += c-cc; o.real.u += u-cu; o.sold.c+=c; o.sold.u+=u;
      o.qty-=take; o.cost.c-=cc; o.cost.u-=cu;
    }
    else if(m.type==='gasto'){ o.exp.c+=c; o.exp.u+=u; }
    else { o.inc.c+=c; o.inc.u+=u; }
  }
  if(o.qty<1e-9){ o.qty=0; o.cost=z(); }
  o.val = z();
  if(o.qty>0){
    if(p.price){ o.val.c = toCUP(p.price.amt*o.qty,p.price.cur,S.rates); o.val.u = toUSD(p.price.amt*o.qty,p.price.cur,S.rates); }
    else { o.val = {c:o.cost.c,u:o.cost.u}; o.noPrice=true; }
  }
  o.unr = {c:o.val.c-o.cost.c, u:o.val.u-o.cost.u};
  o.net = {c:o.real.c+o.unr.c+o.inc.c-o.exp.c, u:o.real.u+o.unr.u+o.inc.u-o.exp.u};
  o.base = {c:o.bought.c+o.exp.c, u:o.bought.u+o.exp.u};         // todo lo que pusiste
  o.roi = o.base.c>0 ? (pick(o.net)/pick(o.base))*100 : NaN;
  o.avgUnit = o.qty>0 ? o.cost : null;
  return o;
}
function totals(){
  const T = {cost:z(),val:z(),real:z(),unr:z(),exp:z(),inc:z(),net:z(),base:z(),n:0};
  const per = S.products.map(p=>({p, c:calc(p)}));
  for(const {c} of per){ for(const k of ['cost','val','real','unr','exp','inc','net','base']){ T[k].c+=c[k].c; T[k].u+=c[k].u; } }
  T.roi = T.base.c>0 ? (pick(T.net)/pick(T.base))*100 : NaN;
  return {T, per};
}
// Flujo de dinero real por cartera (moneda x método)
function wallets(){
  const W = {};
  for(const m of S.moves){
    const k = m.cur+'|'+m.method; const w = W[k] || (W[k]={cur:m.cur,method:m.method,in:0,out:0});
    if(OUT[m.type]) w.out+=m.amt; else w.in+=m.amt;
  }
  return Object.values(W).sort((a,b)=>CURS.indexOf(a.cur)-CURS.indexOf(b.cur) || a.method.localeCompare(b.method));
}
const hasRates = () => S.rates.USD > 0;

/* ============ UI base ============ */
let tab = 'resumen', filter = {type:'', method:'', cur:'', pid:''};
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function openSheet(title, html, onReady){
  closeSheet();
  const bg=document.createElement('div'); bg.className='sheet-bg'; bg.id='sheetbg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${html}</div>`;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeSheet(); });
  document.body.appendChild(bg);
  if(onReady) onReady(bg.querySelector('.sheet'));
}
function closeSheet(){ const b=$('#sheetbg'); if(b) b.remove(); }
const opts = (obj, sel) => Object.entries(obj).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(v)}</option>`).join('');
const curOpts = sel => CURS.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('');
function spark(vals){
  vals = vals.filter(Number.isFinite); if(vals.length<2) return '<div class="hint">Aún no hay suficientes datos para la gráfica.</div>';
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1, W=300, H=46;
  const pts = vals.map((v,i)=>[(i/(vals.length-1))*W, H-4-((v-mn)/rg)*(H-8)]);
  const up = vals[vals.length-1]>=vals[0];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Tendencia"><polyline fill="none" stroke="${up?'var(--gain)':'var(--loss)'}" stroke-width="2.2" stroke-linejoin="round" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/></svg>`;
}

/* ============ Pantallas ============ */
const ICONS = {
  resumen:'<svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  inversiones:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  movimientos:'<svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3"/><path d="M17 20V4M17 4l-3 3M17 4l3 3"/></svg>',
  tasas:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.6.8-2.6 2s1 1.7 2.6 2 2.6.8 2.6 2-1.100 2-2.600 2c-1.200 0-2.100-.4-2.600-1.200M12 6v2M12 16v2"/></svg>',
  ajustes:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.800 2.800l-.1-.1a1.700 1.700 0 00-1.800-.3 1.700 1.700 0 00-1 1.500V21a2 2 0 11-4 0v-.1a1.700 1.700 0 00-1.100-1.500 1.700 1.700 0 00-1.800.3l-.1.1a2 2 0 11-2.800-2.800l.1-.1a1.700 1.700 0 00.3-1.800 1.700 1.700 0 00-1.500-1H3a2 2 0 110-4h.1a1.700 1.700 0 001.500-1.100 1.700 1.700 0 00-.3-1.800l-.1-.1a2 2 0 112.800-2.800l.1.100a1.700 1.700 0 001.800.3H9a1.700 1.700 0 001-1.500V3a2 2 0 114 0v.1a1.700 1.700 0 001 1.500 1.700 1.700 0 001.800-.3l.1-.1a2 2 0 112.800 2.800l-.1.100a1.700 1.700 0 00-.3 1.800V9a1.700 1.700 0 001.500 1H21a2 2 0 110 4h-.1a1.700 1.700 0 00-1.500 1z"/></svg>'
};
const TABS = [['resumen','Resumen'],['inversiones','Inversiones'],['movimientos','Movimientos'],['tasas','Tasas'],['ajustes','Ajustes']];
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}" aria-label="${l}">${ICONS[k]}<span>${l}</span></button>`).join('');
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on', b.dataset.view===vcur()));
  $('#fab').style.display = (tab==='inversiones'||tab==='resumen'||tab==='movimientos') ? '' : 'none';
}
function render(){
  renderTabs();
  const f = {resumen:vResumen, inversiones:vInversiones, movimientos:vMovimientos, tasas:vTasas, ajustes:vAjustes}[tab];
  $('#main').innerHTML = f();
  window.scrollTo(0,0);
}
const rateBanner = () => hasRates() ? '' :
  `<div class="banner" data-act="goto" data-tab="tasas">Falta la tasa del dólar. Toca aquí para ponerla en Tasas; sin ella no se pueden convertir CUP ↔ USD.</div>`;

function kpi(l, o, opt={}){
  const v = pick(o), s = other(o);
  return `<div class="kpi"><div class="l">${l}</div><div class="v ${opt.color?cls(v):''}">${opt.color?arrow(v)+' ':''}${opt.sign?signed(v,vcur()):money(v,vcur())}</div><div class="s">${opt.sign?signed(s,otherCur()):money(s,otherCur())}</div></div>`;
}
function vResumen(){
  const {T, per} = totals();
  const net = pick(T.net);
  const ranked = per.filter(x=>x.c.n).sort((a,b)=>pick(b.c.net)-pick(a.c.net));
  const W = wallets();
  return rateBanner() + `
  <div class="card hero">
    <h2>Ganancia / pérdida total</h2>
    <div class="big ${cls(net)}">${arrow(net)} ${signed(net,vcur())}</div>
    <div class="sub">${signed(other(T.net),otherCur())} · Rendimiento <b class="${cls(net)}">${pct(T.roi)}</b> sobre lo que has puesto</div>
  </div>
  <div class="card"><h2>Tasas del mercado informal</h2>${ratesStrip()}</div>
  <div class="card"><h2>Desglose</h2><div class="grid">
    ${kpi('Invertido ahora (costo)',T.cost)}
    ${kpi('Valor de mercado hoy',T.val)}
    ${kpi('Ganancia ya cobrada',T.real,{color:1,sign:1})}
    ${kpi('Ganancia sin cobrar',T.unr,{color:1,sign:1})}
    ${kpi('Gastos',T.exp)}
    ${kpi('Ingresos extra',T.inc)}
  </div>
  <p class="hint">«Ganancia ya cobrada» = ventas menos el costo de lo vendido. «Sin cobrar» = lo que valdría hoy lo que aún tienes, menos lo que te costó.</p></div>
  <div class="card"><h2>Dinero por cartera (efectivo / transferencia)</h2>
    ${W.length ? `<table class="t"><tr><th>Cartera</th><th>Entró</th><th>Salió</th><th>Neto</th></tr>${W.map(w=>{const n=w.in-w.out;return `<tr><td>${w.cur} ${METHODS[w.method].toLowerCase()}</td><td>${nf.format(w.in)}</td><td>${nf.format(w.out)}</td><td class="${cls(n)}"><b>${n>0?'+':''}${nf.format(n)}</b></td></tr>`}).join('')}</table><p class="hint">Es el flujo de lo que has registrado: compras y gastos salen; ventas e ingresos entran. Un neto negativo significa que aún tienes ese dinero metido en mercancía.</p>` : '<div class="empty">Cuando registres compras y ventas verás aquí cuánto movió cada cartera.</div>'}
  </div>
  <div class="card"><h2>Mejores y peores</h2>

/* ============ Acciones ============ */
function setRates(r, src){
  for(const c of ['USD','EUR','MLC']) if(r[c]>0) S.rates[c]=+r[c];
  S.ratesAt = Date.now(); S.ratesSrc = src;
  S.rateHist.push({t:S.ratesAt, USD:S.rates.USD, EUR:S.rates.EUR, MLC:S.rates.MLC});
  if(S.rateHist.length>400) S.rateHist.splice(0, S.rateHist.length-400);
  save();
}
async function fetchRates(silent){
  if(!S.set.token){ if(!silent) toast('Pon tu token de elToque en Ajustes, o escribe las tasas a mano'); return false; }
  if(!navigator.onLine){ if(!silent) toast('Sin conexión'); return false; }
  try{
    const d = today();
    const url = `https://tasas.eltoque.com/v1/trmi?date_from=${d}%2000:00:01&date_to=${d}%2023:59:01`;
    const res = await fetch(url, {headers:{accept:'*/*', Authorization:'Bearer '+S.set.token}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json(); const t = j.tasas || j.rates || j;
    const r = {USD:+t.USD, EUR:+(t.ECU ?? t.EUR), MLC:+t.MLC};
    if(!(r.USD>0)) throw new Error('respuesta sin USD');
    setRates(r, 'elToque'); if(!silent) toast('Tasas actualizadas'); render(); return true;
  }catch(e){
    if(!silent) toast('No se pudo actualizar ('+e.message+'). Revisa token/conexión o escribe las tasas a mano.');
    return false;
  }
}
function download(name, text, mime){
  const blob = new Blob([text],{type:mime}), file = new File([blob], name, {type:mime});
  if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:name}).catch(()=>{}); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportCSV(){
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const rows = [['fecha','inversion','tipo','metodo','moneda','cantidad','precio_unit','monto','tasa_USD_ese_dia','nota']];
  S.moves.slice().sort(byDate).forEach(m=>{ const p=S.products.find(x=>x.id===m.pid); rows.push([m.date,p?.name,m.type,m.method,m.cur,m.qty??'',m.unit??'',m.amt,m.r?.USD??'',m.note||'']); });
  download('movimientos.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}

  const t = e.target.closest('[data-tab],[data-view],[data-act]'); if(!t) return;
  if(t.dataset.tab && !t.dataset.act){ tab=t.dataset.tab; render(); return; }
  if(t.dataset.view){ S.set.view=t.dataset.view; save(); render(); return; }
  const a = t.dataset.act, id = t.dataset.id;
  switch(a){
    case 'goto': tab=t.dataset.tab; render(); break;
    case 'close': closeSheet(); break;
    case 'refresh': fetchRates(false); break;
    case 'newprod': formProd(); break;
    case 'prod': showProd(id); break;
    case 'editprod': formProd(S.products.find(p=>p.id===id)); break;
    case 'price': formPrice(id); break;
    case 'addmove': formMove(t.dataset.type, id); break;
    case 'editmove': { const m=S.moves.find(x=>x.id===id); if(m) formMove(m.type, m.pid, m); break; }
    case 'filter': filter[t.dataset.k]=t.dataset.v; render(); break;
    case 'delmove': if(confirm('¿Eliminar este movimiento?')){ const pid=(S.moves.find(m=>m.id===id)||{}).pid; S.moves=S.moves.filter(m=>m.id!==id); save(); closeSheet(); render(); if(tab!=='movimientos'&&pid) showProd(pid); toast('Eliminado'); } break;
    case 'delprod': if(confirm('¿Eliminar esta inversión y todos sus movimientos?')){ S.products=S.products.filter(p=>p.id!==id); S.moves=S.moves.filter(m=>m.pid!==id); save(); closeSheet(); render(); toast('Eliminada'); } break;
    case 'export': download('inversiones-respaldo-'+today()+'.json', JSON.stringify(S), 'application/json'); break;
    case 'csv': exportCSV(); break;
    case 'import': $('#impFile').click(); break;
    case 'theme': applyTheme(t.dataset.v); break;
    case 'wipe': if(confirm('¿Borrar TODOS los datos? Esto no se puede deshacer.') && confirm('Seguro. ¿Borrar todo?')){ S=fresh(); save(); render(); toast('Datos borrados'); } break;
  }

  e.preventDefault(); const f=e.target, kind=f.dataset.form, d=new FormData(f), id=f.dataset.id;
  if(kind==='rates'){
    const r={USD:+d.get('USD'),EUR:+d.get('EUR'),MLC:+d.get('MLC')};
    if(!(r.USD>0)){ toast('Escribe al menos la tasa del USD'); return; }
    setRates(r,'manual'); toast('Tasas guardadas'); render();
  }
  else if(kind==='settings'){ S.set.token=(d.get('token')||'').trim(); S.set.auto=!!d.get('auto'); save(); toast('Guardado'); }
  else if(kind==='prod'){
    const name=(d.get('name')||'').trim(); if(!name) return;
    let p = id && S.products.find(x=>x.id===id);
    if(p){ Object.assign(p,{name,cat:d.get('cat'),unit:d.get('unit')||'u',notes:d.get('notes')}); save(); closeSheet(); render(); showProd(p.id); }
    else{
      p={id:uid(),name,cat:d.get('cat'),unit:d.get('unit')||'u',notes:d.get('notes'),price:null,hist:[]};
      const pr=+d.get('price'); if(pr>0){ p.price={amt:pr,cur:d.get('pcur'),t:Date.now()}; p.hist.push({t:Date.now(),amt:pr,cur:d.get('pcur')}); }
      S.products.push(p); save(); closeSheet(); render(); showProd(p.id); toast('Ahora registra la primera compra');
    }
  }
  else if(kind==='price'){
    const p=S.products.find(x=>x.id===id), amt=+d.get('amt'); if(!(amt>=0)) return;
    p.price={amt,cur:d.get('cur'),t:Date.now()}; (p.hist=p.hist||[]).push({t:Date.now(),amt,cur:d.get('cur')});
    save(); closeSheet(); render(); showProd(id); toast('Precio actualizado');
  }
  else if(kind==='move'){
    const type=f.dataset.type, trade=type==='compra'||type==='venta', cur=d.get('cur');
    const r=Object.assign({},S.rates); if(cur!=='CUP'){ const x=+d.get('rate'); if(!(x>0)){ toast('Pon la tasa'); return; } r[cur]=x; }
    let qty=null,unit=null,amt;
    if(trade){ qty=+d.get('qty'); unit=+d.get('unit'); amt=qty*unit; if(!(qty>0)||!(unit>=0)){ toast('Revisa cantidad y precio'); return; } }
    else{ amt=+d.get('amt'); if(!(amt>0)){ toast('Escribe el monto'); return; } }
    const rec={pid:d.get('pid'),type,date:d.get('date'),method:d.get('method'),cur,qty,unit,amt,r:{USD:r.USD,EUR:r.EUR,MLC:r.MLC},note:d.get('note')||''};
    if(id){ const m=S.moves.find(x=>x.id===id); Object.assign(m,rec); } else S.moves.push(Object.assign({id:uid(),ts:Date.now()},rec));
    save(); closeSheet(); render(); if(tab!=='movimientos') showProd(rec.pid); toast('Guardado');
  }
});

/* ============ Inicio ============ */
try{ const th=localStorage.getItem('inv_theme'); if(th) applyTheme(th); }catch(e){}
render();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
if(S.set.auto && S.set.token && (!S.ratesAt || Date.now()-S.ratesAt>3*3600e3)) fetchRates(true);
window.addEventListener('online', ()=>{ if(S.set.auto && S.set.token && (!S.ratesAt || Date.now()-S.ratesAt>3*3600e3)) fetchRates(true); });
</script>
</body>
